name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'akshitkrnagpal/shiki-env-spec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; if (process.env.RELEASE_TAG !== 'v' + pkg.version) throw new Error('Release tag must equal v' + pkg.version);"
      - name: Install an npm CLI with trusted publishing support
        run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Publish with npm trusted publishing
        run: npm publish --access public
